bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_dstar_planner/DStarPlanner"
      # ── Core D* Parameters ───────────────────────────────────────────
      lethal_cost_threshold: 253          # Internal cost value >= this is impassable
      unknown_traversal_cost: 2.0         # Cost multiplier for unknown cells (> 1.0 discourages blind planning)
      allow_unknown: true                 # Whether to plan through unmapped space
      heuristic_weight: 1.0               # Must be 1.0 for D* Lite key consistency
      enable_incremental_updates: true    # Enable D* Lite incremental replanning
      # ── Obstacle Avoidance (Clearance Field) ─────────────────────────
      enable_clearance_field: true        # Dijkstra-based distance field from lethal cells
      clearance_field_weight: 2.0         # Strength of obstacle repulsion (higher = wider berth)
      clearance_decay_distance: 0.5       # Exponential decay distance in meters (smaller = sharper falloff)
      # ── Terrain Cost ─────────────────────────────────────────────────
      terrain_weight: 2.0                 # Weight for terrain difficulty from unified costmap (0-99 values)
      # ── Topic ────────────────────────────────────────────────────────
      unified_costmap_topic: "/unified_costmap"
      # ── ERC Waypoint Parameters ───────────────────────────────────────
      start_end: [0.0, 0.0]
      waypoints: [-0.181, -0.187, -9.431, 6.813, -8.181, 16.563, -5.431, 26.313, 1.819, 28.063, -0.181, -0.187]

# ── Unified Costmap Fuser ──────────────────────────────────────────────────
# Derives lethal obstacles + terrain costs purely from the 2.5D heightmap.
# The 2D /map is NOT used (it is itself derived from the heightmap).
# Lethal cells (cliffs, steep slopes) = 100.
# Non-lethal cells carry terrain difficulty cost (0-99).
# An inflation layer dilates lethal cells for robot footprint safety.
heightmap_to_costmap:
  ros__parameters:
    use_sim_time: true
    heightmap_topic: "/active_map/heightmap"
    heightmap_range_topic: "/active_map/heightmap_range"
    unified_costmap_topic: "/unified_costmap"
    occupancy_heightmap_scale: 0.015      # Fallback scale if heightmap_range not received
    MAX_SAFE_SLOPE: 1.20                  # Allows rover to climb steeper slopes (dz/dx = 1.20)
    MAX_SAFE_ROUGHNESS: 0.50              # Roughness threshold
    steepness_weight: 0.50                # Weight of slope in terrain difficulty cost (0-99)
    roughness_weight: 0.10                # Weight of roughness in terrain difficulty cost (0-99)
    max_traversable_height_diff: 0.45     # Height step > 0.45m = lethal (allows climbing higher terrain)
    publish_rate: 1.0                     # Fused costmap publish rate (Hz)
    # ── Inflation Layer ──────────────────────────────────────────────
    inscribed_radius: 0.25                # 0.25m inscribed radius (rover safety margin)
    inflation_radius: 0.40                # 0.40m inflation radius for soft repulsion
    inflation_cost_scaling: 3.0           # Exponential decay factor


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["general_goal_checker"]
    progress_checker_plugins: ["progress_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 60.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.35
      vy_std: 0.0
      wz_std: 0.6
      vx_max: 0.7
      vx_min: -0.1
      wz_max: 1.2
      iteration_count: 2
      prune_distance: 3.5
      transform_tolerance: 0.35
      temperature: 0.25
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      reset_period: 1.0
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "ObstaclesCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 5.0
        critical_weight: 50.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.5
        near_goal_distance: 0.8
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        max_path_occupancy_ratio: 0.95
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 15
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 15
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.35
        max_angle_to_furthest: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      origin_x: -4.0
      origin_y: -4.0
      resolution: 0.05
      footprint: "[[0.39, 0.40], [0.39, -0.40], [-0.39, -0.40], [-0.39, 0.40]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/unified_costmap"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 1.2

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.39, 0.40], [0.39, -0.40], [-0.39, -0.40], [-0.39, 0.40]]"
      resolution: 0.1
      width: 1000
      height: 1000
      origin_x: -50.0
      origin_y: -50.0
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/unified_costmap"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 1.2

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
