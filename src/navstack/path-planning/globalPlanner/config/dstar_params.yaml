dstar_global_planner:
  ros__parameters:
    # ── Core D* Parameters ───────────────────────────────────────────
    lethal_cost_threshold: 253          # Internal cost value >= this is impassable
    unknown_traversal_cost: 2.0         # Cost multiplier for unknown cells
    allow_unknown: true                 # Whether to plan through unmapped space
    heuristic_weight: 1.0               # Must be 1.0 for D* Lite key consistency
    enable_incremental_updates: true    # Enable D* Lite incremental replanning
    # ── Obstacle Avoidance (Clearance Field) ─────────────────────────
    enable_clearance_field: true        # Dijkstra-based distance field from lethal cells
    clearance_field_weight: 5.0         # Strength of obstacle repulsion (higher = wider berth)
    clearance_decay_distance: 0.5       # Exponential decay distance in meters (smaller = sharper falloff)
    # ── Terrain Cost ─────────────────────────────────────────────────
    terrain_weight: 2.0                 # Weight for terrain difficulty from unified costmap (0-99 values)
    # ── Topic ────────────────────────────────────────────────────────
    unified_costmap_topic: "/unified_costmap"